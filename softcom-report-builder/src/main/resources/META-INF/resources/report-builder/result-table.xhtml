<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
	<!-- Paged result. Params: rbBean (designer or viewer bean), rbTitle (optional heading).
	     Paging redraws only this block, never unsent edits. -->
	<h:panelGroup id="rbResult" layout="block" styleClass="rb-result">
		<h:panelGroup layout="block" styleClass="rb-panel" rendered="#{rbBean.result ne null}">
			<div class="rb-panel-head">
				<span class="rb-head-icon"><i class="fa fa-table" /></span>
				<div class="rb-titles">
					<div class="rb-panel-title">#{empty rbTitle ? rbbundle['rb.results'] : rbTitle}</div>
					<h:panelGroup styleClass="rb-panel-hint" rendered="#{not empty rbBean.pageInfo}">
						<span class="rb-chip">#{rbBean.pageInfo}</span>
					</h:panelGroup>
				</div>
				<div class="rb-end rb-pager">
					<h:outputLabel value="#{rbbundle['rb.pageSize']}" styleClass="rb-label" />
					<p:selectOneMenu value="#{rbBean.pageSize}" autoWidth="false" styleClass="rb-w-xs">
						<f:selectItems value="#{rbBean.pageSizeItems}" />
						<p:ajax listener="#{rbBean.onPageSizeChange}" process="@this" update="@(.rb-result) @(.rb-messages)" />
					</p:selectOneMenu>
					<p:commandButton value="#{rbbundle['rb.previous']}" action="#{rbBean.previous}" disabled="#{not rbBean.hasPrevious}"
						process="@this" update="@(.rb-result) @(.rb-messages)" styleClass="rb-btn" />
					<p:commandButton value="#{rbbundle['rb.next']}" action="#{rbBean.next}" disabled="#{not rbBean.result.hasMore}"
						process="@this" update="@(.rb-result) @(.rb-messages)" styleClass="rb-btn" />
				</div>
			</div>
			<p:dataTable value="#{rbBean.tableRows}" var="row" styleClass="rb-table" rowStyleClass="#{row.styleClass}"
				emptyMessage="#{rbbundle['rb.noRows']}">
				<p:columns value="#{rbBean.result.columns}" var="col" styleClass="#{rbBean.columnStyle(col)}">
					<f:facet name="header">#{rbBean.columnLabel(col)}</f:facet>
					<h:outputText value="#{rbBean.format(row, col)}" />
				</p:columns>
			</p:dataTable>
		</h:panelGroup>
	</h:panelGroup>
</ui:composition>
