<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
	<!-- Value input(s) of one condition. Params: rule (RuleEditor), rbBean (designer or viewer bean). -->
	<ui:param name="kind" value="#{rbBean.valueKind(rule)}" />
	<ui:param name="valueLabel" value="#{rbBean.fieldLabel(rule.field)}" />
	<p:inputText value="#{rule.value}" rendered="#{kind eq 'text' or kind eq 'number'}" styleClass="form-control rb-input" maxlength="500"
		label="#{valueLabel}" />
	<!-- Dates use the browser's own picker (type="date"): its value is always yyyy-MM-dd, the format the rule stores,
	     whatever the display language. p:calendar is avoided on purpose: templates that load bootstrap-datepicker
	     (generalWarehouse does) replace jQuery UI's $.fn.datepicker, and p:calendar then submits mm/dd/yyyy. -->
	<p:inputText type="date" value="#{rule.value}" rendered="#{kind eq 'date'}" styleClass="form-control rb-input rb-date" label="#{valueLabel}" />
	<p:inputText type="datetime-local" value="#{rule.value}" rendered="#{kind eq 'datetime'}" styleClass="form-control rb-input rb-date"
		label="#{valueLabel}" />
	<p:selectOneMenu value="#{rule.value}" rendered="#{kind eq 'choice'}" filter="true" filterMatchMode="contains" autoWidth="false" styleClass="rb-w-lg"
		label="#{valueLabel}">
		<f:selectItem itemLabel="-" itemValue="#{null}" noSelectionOption="true" />
		<f:selectItems value="#{rbBean.choiceItems(rule)}" />
	</p:selectOneMenu>
	<p:selectCheckboxMenu value="#{rule.selected}" rendered="#{kind eq 'choiceList'}" filter="true" filterMatchMode="contains"
		label="#{rbbundle['rb.choose']}" updateLabel="true" styleClass="rb-w-lg">
		<f:selectItems value="#{rbBean.choiceItems(rule)}" />
	</p:selectCheckboxMenu>
	<!-- records searched by name or code (the ids are stored); the dropdown button lists the first ones -->
	<p:autoComplete value="#{rule.value}" rendered="#{kind eq 'lookup'}" completeMethod="#{rbBean.completeLookup}" var="id" itemValue="#{id}"
		itemLabel="#{rbBean.lookupLabel(rule.field, id)}" dropdown="true" forceSelection="true" queryDelay="300" scrollHeight="260"
		placeholder="#{rbbundle['rb.lookupHint']}" emptyMessage="#{rbbundle['rb.lookupNone']}" styleClass="rb-lookup" label="#{valueLabel}">
		<f:attribute name="rbField" value="#{rule.field}" />
	</p:autoComplete>
	<p:autoComplete value="#{rule.selected}" rendered="#{kind eq 'lookupList'}" multiple="true" completeMethod="#{rbBean.completeLookup}"
		var="id" itemValue="#{id}" itemLabel="#{rbBean.lookupLabel(rule.field, id)}" dropdown="true" forceSelection="true" queryDelay="300"
		scrollHeight="260" placeholder="#{rbbundle['rb.lookupHint']}" emptyMessage="#{rbbundle['rb.lookupNone']}"
		styleClass="rb-lookup rb-lookup-multi" label="#{valueLabel}">
		<f:attribute name="rbField" value="#{rule.field}" />
	</p:autoComplete>
	<p:inputText value="#{rule.listText}" rendered="#{kind eq 'list'}" styleClass="form-control rb-input" placeholder="#{rbbundle['rb.listHint']}"
		label="#{valueLabel}" />
	<h:panelGroup rendered="#{rbBean.hasSecondValue(rule)}">
		<span class="rb-between">#{rbbundle['rb.and']}</span>
		<p:inputText value="#{rule.value2}" rendered="#{kind eq 'number' or kind eq 'text'}" styleClass="form-control rb-input" label="#{valueLabel}" />
		<p:inputText type="date" value="#{rule.value2}" rendered="#{kind eq 'date'}" styleClass="form-control rb-input rb-date" label="#{valueLabel}" />
		<p:inputText type="datetime-local" value="#{rule.value2}" rendered="#{kind eq 'datetime'}" styleClass="form-control rb-input rb-date"
			label="#{valueLabel}" />
	</h:panelGroup>
</ui:composition>
